[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "**/migrations/*",
    ".venv",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts",
    "backups",
    "chats",
    "config",
    "llm",
    "ollama_proxy",
    "workspaces",
]
