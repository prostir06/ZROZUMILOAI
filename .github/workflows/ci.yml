name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
          pip install -r requirements-dev.txt
      - name: Lint with ruff
        run: ruff check .
      - name: License check (fail on GPL/AGPL)
        run: |
          pip install 'pip-licenses>=5.0,<6.0'
          python -m piplicenses --from=mixed --fail-on='GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3 (AGPLv3);AGPL;GPL'
      - name: Run tests
        env:
          USE_SQLITE: 'True'
          DJANGO_SECRET_KEY: test-secret-key-at-least-32-chars!!
          CELERY_TASK_ALWAYS_EAGER: 'True'
          ALLOW_REGISTRATION: 'True'
        run: python manage.py test --verbosity=1

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      USE_SQLITE: 'False'
      DJANGO_SECRET_KEY: test-secret-key-at-least-32-chars!!
      CELERY_TASK_ALWAYS_EAGER: 'True'
      ALLOW_REGISTRATION: 'True'
      POSTGRES_DB: zrozumiloai_test
      POSTGRES_USER: zrozumiloai
      POSTGRES_PASSWORD: zrozumiloai
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      REDIS_URL: 'redis://127.0.0.1:6379/0'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: zrozumiloai_test
          POSTGRES_USER: zrozumiloai
          POSTGRES_PASSWORD: zrozumiloai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zrozumiloai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2.7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install dependencies
        run: |
          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate and run full test suite on Postgres+Redis
        run: |
          python manage.py migrate --noinput
          python manage.py test --verbosity=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: License check (fail on GPL/AGPL)
        run: npx --yes license-checker --production --failOn 'GPL;AGPL;GPL-2.0;GPL-3.0;AGPL-3.0;GPL-2.0-only;GPL-3.0-only;AGPL-3.0-only'
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env for compose validation
        run: cp .env.example .env
      - name: Validate docker compose config
        run: docker compose config --quiet
      - name: Validate prod overlay syntax
        run: |
          DJANGO_SECRET_KEY=ci-prod-secret-key-32chars-min!! \
          FIELD_ENCRYPTION_KEY=ci-fernet-key-placeholder-32b!! \
          POSTGRES_PASSWORD=ci-postgres-password \
          REDIS_PASSWORD=ci-redis-password \
          DJANGO_ADMIN_PASSWORD=ci-admin-password \
          CADDY_SITE_ADDRESS=localhost \
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Frontend Dockerfile uses npm ci
        run: |
          grep -q 'package-lock.json' frontend/Dockerfile
          grep -q 'npm ci' frontend/Dockerfile
      - name: Health route exists
        run: grep -q "api/health" backend/config/urls.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build core images
        run: docker compose build backend worker frontend
      - name: Start core services without pulling ollama
        run: |
          docker compose up -d --wait db redis
          docker compose up -d --no-deps --wait backend
          docker compose up -d --no-deps --wait frontend
      - name: Smoke-probe HTTP endpoints
        run: |
          curl -fsS http://127.0.0.1/api/health/ | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['database']=='ok' and d['cache']=='ok', d"
          curl -fsS http://127.0.0.1/ >/dev/null
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=50
      - name: Tear down compose stack
        if: always()
        run: docker compose down -v
