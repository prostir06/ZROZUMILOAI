# Production overlay — без слабких дефолтів + resource caps для кампусу на одному VPS.
#
# Рекомендовано: хост ≥16 GB RAM (llama3.2 + панель + Postgres/Redis).
# Під тиском спочатку: не робити pull великих моделей / mass reindex; знизьте OLLAMA_NUM_PARALLEL=1.
#
# Використання:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Ollama може бути на іншому хості: задайте OLLAMA_BASE_URL у .env (backend/worker).

services:
  db:
    mem_limit: 2g
    cpus: 1.0
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

  redis:
    # Закріплено на BSD Redis 7.2.x (не 7.4+/SSPL). Альтернатива: valkey/valkey:8-alpine.
    image: redis:7.2.7-alpine
    mem_limit: 512m
    cpus: 0.5
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}

  ollama:
    # Закріпіть версію під свій деплой замість latest.
    image: ollama/ollama:0.9.0
    # Найбільший споживач RAM на спільному VPS — залишити ≥4g для db+api+redis+caddy.
    mem_limit: ${OLLAMA_MEM_LIMIT:-10g}
    cpus: ${OLLAMA_CPUS:-2.0}
    environment:
      # Кампусні дефолти (не беруться з локального .env з PARALLEL=4).
      # На VPS ≥16GB можна підняти до 2 через перезапис тут або PROD_* нижче.
      OLLAMA_NUM_PARALLEL: ${PROD_OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_QUEUE: ${PROD_OLLAMA_MAX_QUEUE:-1}

  backend:
    mem_limit: 1g
    cpus: 1.0
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Set FIELD_ENCRYPTION_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DJANGO_ADMIN_PASSWORD: ${DJANGO_ADMIN_PASSWORD:?Set DJANGO_ADMIN_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      ALLOW_REGISTRATION: "False"
      FORCE_DB_RESTORE: "0"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      GUNICORN_WORKERS: ${PROD_GUNICORN_WORKERS:-2}
      GUNICORN_WORKER_CONNECTIONS: ${PROD_GUNICORN_WORKER_CONNECTIONS:-200}
      GUNICORN_TIMEOUT: ${PROD_GUNICORN_TIMEOUT:-120}
      # Трохи жорсткіші ліміти для embed/LMS на спільному VPS.
      WIDGET_CHAT_RATE: ${PROD_WIDGET_CHAT_RATE:-30/minute}
      USER_CHAT_RATE: ${PROD_USER_CHAT_RATE:-30/minute}
      DJANGO_LOG_FORMAT: ${DJANGO_LOG_FORMAT:-json}

  worker:
    mem_limit: 1g
    cpus: 1.0
    # Ingest не паралелить PDF×N на спільному хості з Ollama.
    command: celery -A config worker -l info --concurrency=${PROD_CELERY_CONCURRENCY:-1}
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Set FIELD_ENCRYPTION_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      RAG_EMBED_CONCURRENCY: ${PROD_RAG_EMBED_CONCURRENCY:-2}
      DJANGO_LOG_FORMAT: ${DJANGO_LOG_FORMAT:-json}

  telegram_poller:
    mem_limit: 512m
    cpus: 0.5
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Set FIELD_ENCRYPTION_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      DJANGO_LOG_FORMAT: ${DJANGO_LOG_FORMAT:-json}

  frontend:
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?Set CADDY_SITE_ADDRESS e.g. chat.example.com}
